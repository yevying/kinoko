# M6 服务端天气功能开关（re-architecture: v83 天气系统 kinoko 移植）。
# 全部默认开启；改为 false 可整体/逐项关闭对应功能。
# 由 kinoko.weather.WeatherSettings 读取，weather.properties 不存在时按默认值 true 生效。

# 夜战标量：夜间伤害（怪打玩家 x1.10 / 玩家打怪 x0.909）、经验 x1.15、刷怪密度 x1.35
weather.nightCombat.enabled = true

# 夜行怪：夜间在 Henesys/Ellinia/Kerning/Perion/Lith 等区域刷出的区域怪
weather.nocturnalMobs.enabled = true

# 暴风雪减速：露天 blizzard 图对玩家施加 Slow 减速（客户端可见图标 + 移速缩放）
weather.blizzardSlow.enabled = true
